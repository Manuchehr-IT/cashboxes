services:
  # Свой, самостоятельный Traefik — в отличие от docker-compose.yml, где Traefik общий и внешний
  # (traefik-infra, сеть web), тут сервер обычно доступен только по голому IP в локальной сети:
  # Let's Encrypt не выпускает сертификаты на IP, поэтому здесь просто HTTP, без TLS/certresolver.
  traefik:
    image: traefik:v2.11
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

  postgres:
    image: postgres:16.2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE__USER}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD}
      POSTGRES_DB: ${DATABASE__NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE__USER} -d ${DATABASE__NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    restart: unless-stopped
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - .env
      - backend/.env
    labels:
      - "traefik.enable=true"
      # Бэкенд нужен только фронту — отдельного порта наружу не публикует, доступен только
      # под тем же Host (IP сервера), что и фронт, и только по /v1, /storage. Приоритет выше,
      # чем у catch-all роутера фронта ниже — иначе на этих путях выигрывал бы он.
      - "traefik.http.routers.cashboxes_backend.rule=Host(${DOMAIN}) && PathPrefix(`/v1`, `/storage`)"
      - "traefik.http.routers.cashboxes_backend.entrypoints=web"
      - "traefik.http.routers.cashboxes_backend.priority=20"
      - "traefik.http.services.cashboxes_backend.loadbalancer.server.port=8000"
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions
      - ./backend/logs:/app/logs
      - ./backend/storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    restart: unless-stopped
    build:
      context: frontend
      dockerfile: Dockerfile.production
    labels:
      - "traefik.enable=true"
      # catch-all — приоритет ниже, чем у backend'а выше, чтобы /v1 и /storage не перехватывались
      # этим роутером.
      - "traefik.http.routers.cashboxes_frontend.rule=Host(${DOMAIN})"
      - "traefik.http.routers.cashboxes_frontend.entrypoints=web"
      - "traefik.http.routers.cashboxes_frontend.priority=1"
      - "traefik.http.services.cashboxes_frontend.loadbalancer.server.port=80"
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
